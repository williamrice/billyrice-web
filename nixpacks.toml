[variables]
NIXPACKS_NODE_VERSION = '24'

[phases.setup]
# nixpkgs 25.05; the previous pin predated nodejs_24.
nixpkgsArchive = 'ac62194c3917d5f474c1a844b6fd6da2db95077d'

[phases.install]
# npm 10 rejects this lockfile over @napi-rs/wasm-runtime peer deps (napi-rs#3174),
# so pin npm 11 explicitly instead of trusting the image default.
cmds = [
  'npm install -g --prefix /usr/local npm@11',
  '/usr/local/bin/npm ci --no-audit --no-fund',
]